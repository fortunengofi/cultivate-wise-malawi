<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Offline - Ulimi Wanzeru</title>
<style>
body{font-family:system-ui,sans-serif;background:#f5f1e8;color:#2a2a2a;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:1.5rem;text-align:center}
.box{max-width:420px}
h1{color:#2d8a4f;font-size:1.75rem;margin:0 0 .5rem}

<body><div class="box"><div class="emoji">🌱</div><h1>You're offline</h1>
